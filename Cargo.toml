[workspace]
resolver = "3"

members = [
    "alass-core",
    "alass-cli",
    "alass-subparse",
]

[workspace.package]
version = "3.0.0"
authors = ["kaegi <kaegi.dev@gmail.com>"]
license = "GPL-3.0"
edition = "2024"
# 1.85 for edition 2024, 1.88 for `if let ... && ...` chains; the `msrv` job in
# .github/workflows/build.yml is what keeps this honest
rust-version = "1.88"
repository = "https://github.com/kaegi/alass"

[workspace.dependencies]
alass-core = { version = "3.0.0", path = "alass-core" }
alass-subparse = { version = "0.8.0", path = "alass-subparse" }

anyhow = "1.0.104"
chardetng = "1.0.0"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
encoding_rs = "0.8.35"
ffmpeg-next = "9.0.0"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
webrtc-vad = "0.4.0"

rand = "0.10.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
# `0 * len` / `1 * len` are written out deliberately in the rating math, for symmetry
erasing_op = "allow"
identity_op = "allow"

[profile.release]
lto = true
opt-level = 3
