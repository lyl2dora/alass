[package]
name = "alass-cli"
description = "Automatic Language-Agnostic Subtitle Synchronization (Command Line Tool)"
documentation = "https://docs.rs/alass-cli"
readme = "../README.md"
keywords = ["align", "subtitle", "automatic", "api", "tool"]

version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["ffmpeg-binary"]

# Exactly one of these two decides how the audio is read out of a video file.
#
# `ffmpeg-binary` spawns the `ffmpeg`/`ffprobe` executables, which is what the released
# binaries use - it needs nothing at build time. `ffmpeg-library` links against the FFmpeg
# libraries instead, which extracts the audio a few seconds faster but requires the FFmpeg
# development packages (and pkg-config) at compile time.
ffmpeg-binary = ["dep:serde", "dep:serde_json"]
ffmpeg-library = ["dep:ffmpeg-next"]

[dependencies]
alass-core.workspace = true
alass-subparse.workspace = true

anyhow.workspace = true
clap.workspace = true
encoding_rs.workspace = true
indicatif.workspace = true
# only the `ffmpeg-binary` backend needs these - it deserializes ffprobe's JSON
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
webrtc-vad.workspace = true

ffmpeg-next = { workspace = true, optional = true }

[lints]
workspace = true
